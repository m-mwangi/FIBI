# Cloudflare real-IP restoration.
#
# Loaded by the proxy only when CLOUDFLARE=true in .env (see
# deploy/proxy-entrypoint.sh, which copies this file to
# /etc/nginx/conf.d/realip.conf and otherwise writes an empty one).
#
# WHY THIS MATTERS: when Cloudflare proxies a hostname (the orange cloud), every
# request reaching this server comes from a Cloudflare edge address. Without
# this file:
#   - the nginx rate-limit zones key on the Cloudflare IP, so thousands of
#     unrelated visitors share one bucket and get 429s, while an attacker
#     rotating across edge nodes sidesteps the limit entirely;
#   - access logs and the IP forwarded to Express are Cloudflare's, not the
#     visitor's, so abuse cannot be traced or blocked.
#
# `real_ip_header CF-Connecting-IP` is only trustworthy because the
# `set_real_ip_from` list below restricts it to connections that genuinely
# originate from Cloudflare. Never widen that list to 0.0.0.0/0 — that would let
# any client set its own IP by sending the header.
#
# Refresh the ranges with `./deploy/update-cloudflare-ips.sh`. Cloudflare changes
# them rarely, but a stale list silently degrades to the broken behaviour above.
# Source: https://www.cloudflare.com/ips/

# --- IPv4 ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- IPv6 ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare puts the true client address in CF-Connecting-IP and it is a single
# address, not a list, so recursive resolution is neither needed nor wanted.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
