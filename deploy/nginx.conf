# FIBI edge proxy — TLS termination for ${DOMAIN}
#
# This file is a TEMPLATE. The proxy container runs it through `envsubst '$DOMAIN'`
# at startup, so only ${DOMAIN} is substituted; nginx's own runtime variables
# ($host, $remote_addr, ...) are left untouched.
#
# Certificates live on the `letsencrypt_certs` volume and are issued by
# deploy/init-letsencrypt.sh, then renewed by the `certbot` service.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Each connection costs a file descriptor, so this must exceed worker_connections
# or nginx caps out early and logs "worker_connections exceed open file resource
# limit". The container's hard limit is raised to match in docker-compose.yml.
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Project image uploads go through this proxy; keep in step with multer's limit.
    client_max_body_size 25m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Upstreams can be slow on cold start (Prisma connect); allow a real timeout
    # but not an unbounded one.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff font/woff2;

    # Client-IP resolution. Written by deploy/proxy-entrypoint.sh: Cloudflare's
    # set_real_ip_from ranges when CLOUDFLARE=true, otherwise empty. This must be
    # included BEFORE the rate-limit zones below, because those key on
    # $binary_remote_addr and would otherwise bucket every Cloudflare visitor
    # together under a handful of edge addresses.
    include /etc/nginx/conf.d/realip.conf;

    # Rate limits. Auth is brute-forceable, so it gets a much tighter bucket than
    # the rest of the API. Keys are the client IP as seen by this proxy.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn_status 429;

    # Docker's embedded DNS, needed for OCSP stapling lookups.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    upstream fibi_frontend {
        server frontend:80;
        keepalive 16;
    }

    upstream fibi_backend {
        server backend:5000;
        keepalive 32;
    }

    # Shared proxy headers for every backend location.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # OVERWRITE rather than append ($proxy_add_x_forwarded_for). By this point
    # $remote_addr is the authoritative client IP — the peer address in direct
    # mode, or the Cloudflare-verified CF-Connecting-IP in Cloudflare mode — so
    # any X-Forwarded-For the client sent is discarded instead of being carried
    # through. That keeps the header a single trusted address in both modes and
    # is why TRUST_PROXY stays 1 even behind Cloudflare: Express only ever has to
    # trust this one hop.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # ---------------------------------------------------------------------
    # Port 80 — ACME challenges and the redirect to HTTPS.
    # ---------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ${DOMAIN} www.${DOMAIN};

        # Must stay on plain HTTP: Let's Encrypt validates over port 80 and does
        # not follow redirects to a host whose certificate is not yet valid.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://${DOMAIN}$request_uri;
        }
    }

    # ---------------------------------------------------------------------
    # Port 443 — canonicalise www -> apex so cookies have a single origin.
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        include /etc/nginx/conf.d/ssl-params.conf;

        return 301 https://${DOMAIN}$request_uri;
    }

    # ---------------------------------------------------------------------
    # Port 443 — the site.
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        include /etc/nginx/conf.d/ssl-params.conf;

        # HSTS is only safe once HTTPS is confirmed working — see DEPLOYMENT.md
        # before extending max-age or adding `preload`.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(self)" always;

        # Content-Security-Policy — deliberately NOT enabled by default.
        #
        # The directives below are derived from the origins this app actually
        # loads (Google / Apple / Facebook sign-in, Stripe, Unsplash imagery),
        # but a CSP that is even slightly wrong breaks login or checkout in a way
        # that is invisible until a real user hits it. Enable it deliberately:
        #
        #   1. Uncomment the Report-Only line, redeploy, and exercise sign-in,
        #      an image upload and a payment while watching the browser console.
        #   2. Add any origin the console reports as blocked.
        #   3. Only then swap Report-Only for the enforcing header.
        #
        # 'unsafe-inline' on style-src is required by the styling the SPA ships;
        # script-src does not need it, which is the half that matters for XSS.
        #
        # set $fibi_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com; img-src 'self' data: blob: https://images.unsplash.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://accounts.google.com https://appleid.cdn-apple.com https://connect.facebook.net https://js.stripe.com; connect-src 'self' https://accounts.google.com https://appleid.apple.com https://api.stripe.com; frame-src https://accounts.google.com https://appleid.apple.com https://js.stripe.com https://hooks.stripe.com; upgrade-insecure-requests";
        # add_header Content-Security-Policy-Report-Only $fibi_csp always;
        # add_header Content-Security-Policy            $fibi_csp always;

        limit_conn conn_limit 50;

        # Stripe signs the exact bytes it posts. Buffering or rewriting the body
        # breaks signature verification, so this block must precede /api/ and
        # must not carry a rate limit that could drop a webhook.
        location ~ ^/api/v1/(investments/stripe/webhook|stripe/webhook)$ {
            proxy_pass http://fibi_backend;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Brute-force surface: login, register, password reset.
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://fibi_backend;
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://fibi_backend;
        }

        # Project half of the sitemap, generated from the database so a project
        # added through the admin UI is discoverable without waiting for a
        # deploy. Must be served from the root: a sitemap may only list URLs at
        # or below its own path, so /api/v1/... could not contain /projects/<id>.
        #
        # The static half (dist/sitemap-static.xml) and the index that ties them
        # together (dist/sitemap.xml) are built with the frontend and fall
        # through to it below.
        location = /sitemap-projects.xml {
            proxy_pass http://fibi_backend;
        }

        # User-uploaded project images. Served by Express from the shared volume.
        location /uploads/ {
            proxy_pass http://fibi_backend;
            # Set explicitly rather than via `expires`, which would emit a second,
            # conflicting Cache-Control header alongside this one.
            add_header Cache-Control "public, max-age=604800" always;
            # Uploaded files are never executed or rendered as documents.
            add_header X-Content-Type-Options "nosniff" always;
            # A location-level add_header drops the server-level set, so the
            # security headers that matter here are repeated.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Everything else is the SPA.
        location / {
            proxy_pass http://fibi_frontend;
        }
    }
}
