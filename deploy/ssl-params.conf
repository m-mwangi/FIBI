# Shared TLS settings, included by every HTTPS server block in nginx.conf.
# Mozilla "intermediate" profile, minus the DHE suites — those would require a
# generated ffdhe2048 parameter file, and every browser FIBI targets speaks ECDHE.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Stapling removes a round trip to the CA from the client's handshake.
# Harmless if the chain file is missing — nginx just logs and skips it.
ssl_stapling on;
ssl_stapling_verify on;
