# Serves the built Vite SPA inside the `frontend` container.
# This sits BEHIND the edge proxy (deploy/nginx.conf), which owns TLS, HSTS and
# the security headers. Keep this file focused on static-asset delivery.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml font/woff font/woff2;

    # Container healthcheck target; not proxied from the edge.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under /assets (index-BJGPsiQT.js), so the
    # filename changes whenever the content does. These can be cached forever.
    # Note: no `expires` directive anywhere in this file. It emits its own
    # Cache-Control on top of add_header, producing two conflicting headers on
    # the same response. Cache-Control is set explicitly instead.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static files outside /assets are NOT fingerprinted, so they get a short
    # TTL instead of an immutable one.
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # The SPA entry point must never be cached, or browsers keep loading the old
    # bundle's asset URLs after a deploy and the site breaks until a hard reload.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Prerendered pages are real files (dist/about/index.html, dist/faq/…), so
    # $uri/ finds them before the SPA fallback is reached. Anything else is
    # either a live app route or a genuine 404, and the two are separated
    # below rather than both answering 200.
    # `$uri/index.html` is tried explicitly rather than relying on `$uri/`:
    # the directory form makes nginx 301 to the trailing-slash URL, so /faq
    # would redirect to /faq/ while the canonical tag says /faq. That is a
    # wasted hop on every prerendered page and a canonical the crawler has to
    # reconcile against a redirect.
    location / {
        try_files $uri $uri/index.html @spa;
    }

    # Client-side routes with no prerendered file: /dashboard, /admin/…,
    # /login, /projects/<id> when the build could not reach the API. These are
    # served the SPA shell with a 200, which is correct — the page exists, it
    # is just rendered in the browser.
    #
    # Everything else gets a real 404. Previously *every* unmatched URL
    # returned 200 with the shell, so /nonsense-page was a soft 404: Google
    # saw a successful response, indexed the URL, and an unbounded number of
    # junk URLs could accumulate against the domain.
    location @spa {
        # Prefix match, not exact: /admin/users and /admin/transactions are
        # real routes and an anchored `$` would 404 every admin section.
        #
        # Keep in sync with PRIVATE_ROUTE_PREFIXES and the dynamic routes in
        # src/app/routeConfig.tsx.
        if ($uri ~ ^/(dashboard|admin|member-hub|login|signup|forgot-password|reset-password|membership/(apply|billing)|projects/|insights/)) {
            rewrite ^ /index.html last;
        }
        return 404;
    }

    # The 404 body is the prerendered NotFound page when the build produced
    # one, so a genuine 404 still looks like the site rather than nginx.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }

    # Dotfiles should never be reachable from the built output.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
